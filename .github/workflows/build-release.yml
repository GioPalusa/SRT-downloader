name: build-and-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest --cov --cov-report=term-missing

  python-package:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke test packaged CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          srt-download --version
          # Real scan: exercises cache config, provider/refiner loading,
          # guessit parsing, bracket filenames, multi-episode files and the
          # resume ledger. Exits 0 even when nothing is found, so it only fails
          # on an actual crash (missing module, list/int bug, glob bug, etc.).
          mkdir -p smoketest
          touch "smoketest/Some.Show.S01E01.1080p.mkv"
          touch "smoketest/Movie [1080p] (2020).mkv"
          touch "smoketest/Pack.S01E01E02.mkv"
          srt-download --language sv smoketest
          # Second run exercises the resume ledger (skip recently checked).
          srt-download --language sv smoketest

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  standalone-binaries:
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: standalone-macos-arm64
            executable_name: srt-download
            asset_name: srt-download-macos-arm64
          - os: windows-latest
            artifact_name: standalone-windows-x64
            executable_name: srt-download.exe
            asset_name: srt-download-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Build standalone executable
        run: pyinstaller fetch_srt_subtitles.spec

      - name: Smoke test executable
        shell: bash
        run: |
          ./dist/${{ matrix.executable_name }} --version
          # Real scan over dummy videos so the frozen binary actually loads the
          # dogpile cache backend, subliminal providers/refiners and guessit
          # data, and exercises bracket filenames, multi-episode parsing and
          # the resume ledger. Catches bundling/logic regressions that
          # --version alone never would.
          mkdir -p smoketest
          touch "smoketest/Some.Show.S01E01.1080p.mkv"
          touch "smoketest/Movie [1080p] (2020).mkv"
          touch "smoketest/Pack.S01E01E02.mkv"
          ./dist/${{ matrix.executable_name }} --language sv smoketest
          # Second run exercises the resume ledger (skip recently checked).
          ./dist/${{ matrix.executable_name }} --language sv smoketest

      # --- Code signing (secret-gated; skipped entirely when secrets absent) ---
      - name: Check macOS signing secrets
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::macOS signing secrets not configured; shipping an unsigned binary."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Codesign and notarize (macOS)
        if: runner.os == 'macOS' && steps.macsign.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER }}
        run: |
          BIN="./dist/${{ matrix.executable_name }}"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          # A bare Mach-O CLI cannot be stapled (only bundles/pkg/dmg can), so we
          # notarize for the online Gatekeeper check. For fully offline trust,
          # wrap the binary in a notarized+stapled .pkg (future enhancement).
          echo "$APPLE_NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k "$BIN" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_API_KEY_ID" \
            --issuer "$APPLE_NOTARY_API_ISSUER" \
            --wait

      - name: Check Windows signing secrets
        id: winsign
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$PFX" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Windows signing secrets not configured; shipping an unsigned exe."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign executable (Windows)
        if: runner.os == 'Windows' && steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 "./dist/${{ matrix.executable_name }}"
          & $signtool verify /pa "./dist/${{ matrix.executable_name }}"

      - name: Rename release asset
        shell: bash
        run: mv ./dist/${{ matrix.executable_name }} ./dist/${{ matrix.asset_name }}

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./dist/${{ matrix.asset_name }}
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - python-package
      - standalone-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/python-packages/*
            release-assets/standalone-macos-arm64/srt-download-macos-arm64
            release-assets/standalone-windows-x64/srt-download-windows-x64.exe
