[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-downloader"
version = "0.1.5"
description = "Download subtitles for local video files recursively."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "babelfish>=0.6.1",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "subliminal>=2.6.0",
]
keywords = ["subtitle", "srt", "cli", "video"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
build = [
  "build>=1.2.2",
  "pyinstaller>=6.6.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
srt-download = "fetch_srt_subtitles:main"

[project.urls]
Homepage = "https://github.com/GioPalusa/SRT-downloader"
Issues = "https://github.com/GioPalusa/SRT-downloader/issues"

[tool.setuptools]
py-modules = ["fetch_srt_subtitles"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:fetch_srt_subtitles"]

[tool.coverage.run]
source = ["fetch_srt_subtitles"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
  "E501",  # long argparse help strings and log lines
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["fetch_srt_subtitles.py"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
no_implicit_optional = true
